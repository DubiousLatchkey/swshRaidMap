        function getOptimizationPoolVersionId(pool) {
            return pool && pool.version === 'shield' ? 2 : 1;
        }

        function getOptimizationPoolRankBounds(pool) {
            const tier = pool && (pool.progression_tier || pool.tier);
            return tier === 'early' ? {min: 0, max: 1} : {min: 2, max: 4};
        }

        function encounterMatchesPokemon(candidate, pokemon) {
            return ['species', 'altForm', 'ability', 'gender', 'gigantamax', 'flawlessIVs', 'minRank', 'maxRank']
                .every(field => candidate[field] === pokemon[field]);
        }

        function optimizationPoolMatchesPokemon(den, beam, pokemon) {
            if (!den || !Array.isArray(currentPoolMatches) || currentPoolMatches.length === 0) {
                return false;
            }

            return currentPoolMatches.some(pool => {
                if (!pool || pool.beam !== beam || !denMatchesOptimizationPool(den, pool)) {
                    return false;
                }

                const versionId = getOptimizationPoolVersionId(pool);
                if (!Array.isArray(pokemon.versions) || !pokemon.versions.includes(versionId)) {
                    return false;
                }

                const rankBounds = getOptimizationPoolRankBounds(pool);
                const denTableIndexes = getRaidTableIndexesForDen(den, beam, pool.version);
                return pool.aliases.some(alias => {
                    const tableIndex = Number(alias.raid_table_index);
                    if (Number(alias.pool_id) !== Number(den[`${beam}_pool`]) ||
                        !denTableIndexes.includes(tableIndex)) {
                        return false;
                    }

                    const table = raidTables[tableIndex];
                    return table && table.version === versionId && table.pokemon.some(candidate =>
                        encounterMatchesPokemon(candidate, pokemon) &&
                        candidate.maxRank >= rankBounds.min && candidate.minRank <= rankBounds.max
                    );
                });
            });
        }

        function pokemonMatchesCurrentFilters(pokemon, context = null) {
            const hasFilters = currentFilter || selectedStars.size > 0 || currentPoolFilter;
            if (!hasFilters) {
                return false;
            }
            
            const pokemonId = currentFilter ? parseInt(currentFilter) : null;
            const hasStarFilter = selectedStars.size > 0;
            
            let pokemonMatches = true;
            if (pokemonId) {
                pokemonMatches = pokemon.species === pokemonId;
            }
            
            let starMatches = true;
            if (hasStarFilter) {
                const selectedRanks = Array.from(selectedStars).map(star => star - 1);
                let pokemonRanks = [];
                
                if (pokemon.swordRanks && typeof pokemon.swordRanks === 'object') {
                    for (let rank = pokemon.swordRanks.min; rank <= pokemon.swordRanks.max; rank++) {
                        if (!pokemonRanks.includes(rank)) {
                            pokemonRanks.push(rank);
                        }
                    }
                }
                if (pokemon.shieldRanks && typeof pokemon.shieldRanks === 'object') {
                    for (let rank = pokemon.shieldRanks.min; rank <= pokemon.shieldRanks.max; rank++) {
                        if (!pokemonRanks.includes(rank)) {
                            pokemonRanks.push(rank);
                        }
                    }
                }
                
                if (pokemon.minRank !== undefined && pokemon.maxRank !== undefined) {
                    for (let rank = pokemon.minRank; rank <= pokemon.maxRank; rank++) {
                        if (!pokemonRanks.includes(rank)) {
                            pokemonRanks.push(rank);
                        }
                    }
                }
                
                starMatches = selectedRanks.some(selectedRank => pokemonRanks.includes(selectedRank));
            }

            let poolMatches = true;
            if (currentPoolFilter) {
                poolMatches = Boolean(context && optimizationPoolMatchesPokemon(context.den, context.beam, pokemon));
            }
            
            return pokemonMatches && starMatches && poolMatches;
        }
        // Pokemon filter setup
        function setupPokemonFilter() {
            pokemonList = Object.entries(pokemonNames).map(([id, name]) => ({
                id: parseInt(id),
                name: name,
                searchText: normalizeOptimizationSearchText(name)
            }));

            pokemonList.sort((a, b) => a.name.localeCompare(b.name));
        }

        function capitalizePokemonName(name) {
            return name.split(' ').map(word =>
                word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
            ).join(' ');
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[character]));
        }

        function normalizeOptimizationSearchText(value) {
            return String(value ?? '')
                .toLowerCase()
                .replace(/[_-]+/g, ' ')
                .replace(/[^a-z0-9]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function getOptimizationPoolDisplayName(pool) {
            const version = pool && pool.version === 'shield' ? 'shield' : 'sword';
            const rarity = pool && pool.beam === 'rare' ? 'rare' : 'common';
            const tier = pool && (pool.progression_tier || pool.tier);
            const poolId = Number(pool && pool.aliases && pool.aliases[0] && pool.aliases[0].pool_id);
            const encounterPool = Number.isInteger(poolId) ? poolId : 'unknown';
            return `${version}-${rarity}-${String(tier || 'unknown').toLowerCase()}-${encounterPool}`;
        }

        function getOptimizationPoolSearchEntry(pool) {
            const speciesIds = new Set();
            const addSpecies = value => {
                const speciesId = Number(value);
                if (Number.isInteger(speciesId) && speciesId > 0) {
                    speciesIds.add(speciesId);
                }
            };

            (pool.direct_species || []).forEach(addSpecies);
            ['generation_8_assignments', 'older_assignments', 'future_assignments'].forEach(field => {
                (pool[field] || []).forEach(assignment => {
                    addSpecies(assignment.target);
                    addSpecies(assignment.source);
                });
            });

            const speciesNames = Array.from(speciesIds)
                .map(speciesId => pokemonNames[speciesId])
                .filter(Boolean)
                .map(normalizeOptimizationSearchText);
            const aliases = Array.isArray(pool.aliases) ? pool.aliases : [];
            const aliasPoolIds = new Set(
                aliases
                    .map(alias => Number(alias.pool_id))
                    .filter(poolId => Number.isInteger(poolId))
            );
            const aliasSearchValues = aliases.flatMap(alias => {
                const poolId = Number(alias.pool_id);
                const tableIndex = Number(alias.raid_table_index);
                return [
                    Number.isInteger(poolId) ? `pool ${poolId}` : '',
                    Number.isInteger(tableIndex) ? `table ${tableIndex}` : ''
                ];
            });
            const signature = pool.pool_key.split('-').pop().toLowerCase();
            const label = getOptimizationPoolDisplayName(pool);

            return {
                key: pool.pool_key,
                label: label,
                pool: pool,
                signature: signature,
                aliasPoolIds: aliasPoolIds,
                speciesNames: speciesNames,
                searchText: normalizeOptimizationSearchText([
                    label,
                    pool.pool_key,
                    pool.version,
                    pool.beam,
                    pool.progression_tier,
                    signature,
                    ...Array.from(speciesIds),
                    ...speciesNames,
                    ...speciesNames.map(name => name.replace(/\s+/g, '')),
                    ...aliasSearchValues
                ].join(' '))
            };
        }

        function parseOptimizationPoolQuery(query) {
            const rawQuery = String(query ?? '').trim().toLowerCase();
            const normalizedQuery = normalizeOptimizationSearchText(rawQuery);
            const parsed = {
                version: null,
                beam: null,
                tier: null,
                signature: null,
                poolIds: [],
                terms: []
            };

            if (!rawQuery) return parsed;

            const exactKey = rawQuery.match(/^(sword|shield)-(common|rare)-(early|late)-([0-9a-f]{12})$/);
            if (exactKey) {
                parsed.version = exactKey[1];
                parsed.beam = exactKey[2];
                parsed.tier = exactKey[3];
                parsed.signature = exactKey[4];
                return parsed;
            }

            const exactHuntKey = rawQuery.match(/^(sword|shield)-(common|rare)-(early|late)-(\d+)$/);
            if (exactHuntKey) {
                parsed.version = exactHuntKey[1];
                parsed.beam = exactHuntKey[2];
                parsed.tier = exactHuntKey[3];
                parsed.poolIds = [Number(exactHuntKey[4])];
                return parsed;
            }

            const versionMatch = normalizedQuery.match(/\b(sword|shield)\b/);
            const beamMatch = normalizedQuery.match(/\b(common|rare)\b/);
            const tierMatch = normalizedQuery.match(/\b(early|late|low|high)\b/);
            if (versionMatch) parsed.version = versionMatch[1];
            if (beamMatch) parsed.beam = beamMatch[1];
            if (tierMatch) parsed.tier = tierMatch[1] === 'low' ? 'early' : (tierMatch[1] === 'high' ? 'late' : tierMatch[1]);

            const starRange = rawQuery.match(/(?:^|\s)(1\s*(?:[-–—]|to)\s*2|3\s*(?:[-–—]|to)\s*5)(?:\s*stars?)?(?=\s|$)/i)
                || rawQuery.match(/\bstars?\s*[:=]?\s*(1\s*(?:[-–—]|to)\s*2|3\s*(?:[-–—]|to)\s*5)(?=\s|$)/i);
            if (starRange) {
                parsed.tier = starRange[1].replace(/\s+/g, '').startsWith('1') ? 'early' : 'late';
            } else {
                const singleStar = rawQuery.match(/(?:^|\s)([1-5])\s*stars?(?=\s|$)/i)
                    || rawQuery.match(/\bstars?\s*[:=]?\s*([1-5])(?=\s|$)/i);
                if (singleStar) {
                    parsed.tier = Number(singleStar[1]) <= 2 ? 'early' : 'late';
                }
            }

            const signatureMatch = normalizedQuery.match(/(?:^|\s)([0-9a-f]{12})(?=\s|$)/i);
            if (signatureMatch) parsed.signature = signatureMatch[1].toLowerCase();

            const poolIdPattern = /\bpool(?:\s+ids?)?\s*(?:[:#])?\s*(\d+)\b/gi;
            for (const match of normalizedQuery.matchAll(poolIdPattern)) {
                const poolId = Number(match[1]);
                if (Number.isInteger(poolId)) parsed.poolIds.push(poolId);
            }

            let remaining = normalizedQuery
                .replace(/\b(sword|shield|common|rare|early|late|low|high|versions?|rarit(?:y|ies)|beams?|tiers?|stars?|star|ranges?|signatures?|ids?)\b/g, ' ')
                .replace(/\bpool(?:\s+ids?)?\s*\d+\b/g, ' ')
                .replace(/\b[0-9a-f]{12}\b/g, ' ');

            if (starRange) {
                remaining = remaining.replace(/\b(?:1\s+2|3\s+5)\b/g, ' ');
            } else {
                const singleStar = rawQuery.match(/(?:^|\s)([1-5])\s*stars?(?=\s|$)/i)
                    || rawQuery.match(/\bstars?\s*[:=]?\s*([1-5])(?=\s|$)/i);
                if (singleStar) remaining = remaining.replace(new RegExp(`\\b${singleStar[1]}\\b`, 'g'), ' ');
            }

            parsed.terms = remaining.split(/\s+/).filter(Boolean);
            return parsed;
        }

        function optimizationSearchTermMatches(entry, term) {
            if (entry.searchText.includes(term)) return true;

            // A small one-character tolerance makes hand-entered names such as
            // "amura" still find Amaura without making arbitrary text fuzzy.
            if (term.length < 5) return false;
            return entry.speciesNames.some(name => {
                const compactName = name.replace(/\s+/g, '');
                if (Math.abs(compactName.length - term.length) > 1) return false;
                let differences = 0;
                let nameIndex = 0;
                let termIndex = 0;
                while (nameIndex < compactName.length && termIndex < term.length) {
                    if (compactName[nameIndex] === term[termIndex]) {
                        nameIndex++;
                        termIndex++;
                    } else {
                        differences++;
                        if (differences > 1) return false;
                        if (compactName.length > term.length) nameIndex++;
                        else if (compactName.length < term.length) termIndex++;
                        else {
                            nameIndex++;
                            termIndex++;
                        }
                    }
                }
                return differences + (compactName.length - nameIndex) + (term.length - termIndex) <= 1;
            });
        }

        function optimizationPoolMatchesQuery(entry, parsed) {
            const pool = entry.pool;
            if (parsed.version && pool.version !== parsed.version) return false;
            if (parsed.beam && pool.beam !== parsed.beam) return false;
            if (parsed.tier && (pool.progression_tier || pool.tier) !== parsed.tier) return false;
            if (parsed.signature && entry.signature !== parsed.signature) return false;
            if (parsed.poolIds.length > 0 && !parsed.poolIds.every(poolId => entry.aliasPoolIds.has(poolId))) return false;
            return parsed.terms.every(term => optimizationSearchTermMatches(entry, term));
        }

        function getOptimizationPoolEntriesForQuery(query) {
            const parsed = parseOptimizationPoolQuery(query);
            return optimizationPoolList.filter(entry => optimizationPoolMatchesQuery(entry, parsed));
        }

        function parseRegularMapQuery(query) {
            const normalizedQuery = normalizeOptimizationSearchText(query);
            const criteria = {
                denNumber: null,
                physicalId: null,
                region: null,
                programDenNumber: null,
                commonPoolNumber: null,
                rarePoolNumber: null,
                poolNumber: null
            };

            const denMatch = normalizedQuery.match(/\bden(?:\s+number)?\s+(\d+)\b/);
            const physicalIdMatch = normalizedQuery.match(/\b(wa|ioa|ct|tc|ss)[\s-]*0*(\d{1,3})\b/);
            const regionDenMatch = normalizedQuery.match(/\b(wild\s+area|isle\s+of\s+armor|isle\s+of\s+armour|crown\s+tundra)\s+(?:den\s+)?0*(\d{1,3})\b/);
            const commonPoolMatch = normalizedQuery.match(/\bcommon(?:\s+pool)?(?:\s+number)?\s+(\d+)\b/);
            const rarePoolMatch = normalizedQuery.match(/\brare(?:\s+pool)?(?:\s+number)?\s+(\d+)\b/);
            const poolMatch = normalizedQuery.match(/\bpool(?:\s+(?:ids?|number))?\s+(\d+)\b/);

            if (denMatch) criteria.denNumber = Number(denMatch[1]);
            if (physicalIdMatch) {
                const requestedRegion = physicalIdMatch[1];
                const canonicalRegion = requestedRegion === 'tc' ? 'ct' : requestedRegion;
                criteria.region = canonicalRegion;
                const requestedNumber = Number(physicalIdMatch[2]);
                criteria.programDenNumber = canonicalRegion === 'ss' ? null : requestedNumber;
                criteria.physicalId = `${canonicalRegion}-${String(requestedNumber).padStart(3, '0')}`;
            } else if (regionDenMatch) {
                const regionAliases = {
                    'wild area': 'wa',
                    'isle of armor': 'ioa',
                    'isle of armour': 'ioa',
                    'crown tundra': 'ct'
                };
                criteria.region = regionAliases[regionDenMatch[1]];
                criteria.programDenNumber = Number(regionDenMatch[2]);
            }
            if (commonPoolMatch) criteria.commonPoolNumber = Number(commonPoolMatch[1]);
            if (rarePoolMatch) criteria.rarePoolNumber = Number(rarePoolMatch[1]);
            if (poolMatch) criteria.poolNumber = Number(poolMatch[1]);

            return criteria;
        }

        function regularMapQueryIsExplicit(criteria) {
            return criteria.denNumber != null ||
                criteria.physicalId != null ||
                criteria.programDenNumber != null ||
                criteria.commonPoolNumber != null ||
                criteria.rarePoolNumber != null ||
                criteria.poolNumber != null;
        }

        function getRegularMapDenMatches(criteria) {
            return new Set(
                denData
                    .filter(den => {
                        const commonPoolNumber = Number(den.common_pool);
                        const rarePoolNumber = Number(den.rare_pool);
                        if (criteria.denNumber != null && Number(den.program_den_number) !== criteria.denNumber) return false;
                        if (criteria.physicalId != null && den.physical_id !== criteria.physicalId) return false;
                        if (criteria.programDenNumber != null && Number(den.program_den_number) !== criteria.programDenNumber) return false;
                        if (criteria.region != null && !String(den.physical_id || '').startsWith(`${criteria.region}-`)) return false;
                        if (criteria.commonPoolNumber != null && commonPoolNumber !== criteria.commonPoolNumber) return false;
                        if (criteria.rarePoolNumber != null && rarePoolNumber !== criteria.rarePoolNumber) return false;
                        if (criteria.poolNumber != null && commonPoolNumber !== criteria.poolNumber && rarePoolNumber !== criteria.poolNumber) return false;
                        return true;
                    })
                    .map(den => den.physical_id)
            );
        }

        function getDenIdentityMatches(query) {
            const normalizedQuery = normalizeOptimizationSearchText(query);
            if (!normalizedQuery || /^\d+$/.test(normalizedQuery)) return [];
            const compactQuery = normalizedQuery.replace(/[\s-]+/g, '');
            return denData.filter(den => {
                const prefix = String(den.physical_id || '').split('-')[0] || '';
                const searchable = normalizeOptimizationSearchText([
                    den.physical_id,
                    String(den.physical_id || '').replace('-', ' '),
                    den.display_name,
                    den.location_name,
                    `${den.location_name || ''} den ${den.local_number || ''}`,
                    `${prefix} ${den.program_den_number || ''}`,
                    `${prefix === 'ct' ? 'tc' : prefix} ${den.program_den_number || ''}`
                ].join(' '));
                return searchable.includes(normalizedQuery) ||
                    searchable.replace(/[\s-]+/g, '').includes(compactQuery);
            });
        }

        function getRegularMapSearchSuggestions(query) {
            const normalizedQuery = normalizeOptimizationSearchText(query);
            const criteria = parseRegularMapQuery(query);
            const suggestions = [];
            const addSuggestion = (label, denMatches) => {
                if (denMatches.size > 0) {
                    suggestions.push({
                        label: label,
                        denMatches: denMatches
                    });
                }
            };

            if (criteria.denNumber !== null) {
                addSuggestion(`Program den #${criteria.denNumber}`, getRegularMapDenMatches(criteria));
            }
            if (criteria.physicalId !== null || criteria.programDenNumber !== null) {
                const matchingDens = getRegularMapDenMatches(criteria);
                const matchingDen = denData.find(den => matchingDens.has(den.physical_id));
                addSuggestion(
                    matchingDen ? `${matchingDen.display_name} (${matchingDen.physical_id.toUpperCase()})` : normalizedQuery.toUpperCase(),
                    matchingDens
                );
            }
            if (criteria.commonPoolNumber !== null) {
                addSuggestion(`Common pool #${criteria.commonPoolNumber}`, getRegularMapDenMatches(criteria));
            }
            if (criteria.rarePoolNumber !== null) {
                addSuggestion(`Rare pool #${criteria.rarePoolNumber}`, getRegularMapDenMatches(criteria));
            }
            if (criteria.poolNumber !== null && criteria.commonPoolNumber === null && criteria.rarePoolNumber === null) {
                addSuggestion(`Pool #${criteria.poolNumber} (common or rare)`, getRegularMapDenMatches(criteria));
            }

            if (!regularMapQueryIsExplicit(criteria) && /^\d+$/.test(normalizedQuery)) {
                const number = Number(normalizedQuery);
                addSuggestion(`Program den #${number}`, getRegularMapDenMatches({denNumber: number, commonPoolNumber: null, rarePoolNumber: null, poolNumber: null}));
                addSuggestion(`Common pool #${number}`, getRegularMapDenMatches({denNumber: null, commonPoolNumber: number, rarePoolNumber: null, poolNumber: null}));
                addSuggestion(`Rare pool #${number}`, getRegularMapDenMatches({denNumber: null, commonPoolNumber: null, rarePoolNumber: number, poolNumber: null}));
            }

            if (!regularMapQueryIsExplicit(criteria)) {
                getDenIdentityMatches(query).slice(0, 30).forEach(den => {
                    addSuggestion(
                        `${den.display_name} (${den.physical_id.toUpperCase()})`,
                        new Set([den.physical_id])
                    );
                });
            }

            return suggestions;
        }

        function setupOptimizationPoolFilter() {
            const selectedPools = coverageSolution && Array.isArray(coverageSolution.selected_pools)
                ? coverageSolution.selected_pools
                : [];
            optimizationPoolList = selectedPools
                .filter(pool => typeof pool.pool_key === 'string')
                .map(getOptimizationPoolSearchEntry);
            optimizationPoolIndex = new Map(
                optimizationPoolList.map(entry => [entry.key.toLowerCase(), entry.pool])
            );
            currentPoolMatches = [];
        }

        function getPokemonSearchMatches(query) {
            const normalizedQuery = normalizeOptimizationSearchText(query);
            if (!normalizedQuery) return pokemonList.slice(0, 50);

            return pokemonList.filter(pokemon =>
                pokemon.searchText.includes(normalizedQuery) ||
                pokemon.id.toString() === normalizedQuery
            );
        }

        function getExactPokemonSearchMatch(query) {
            const normalizedQuery = normalizeOptimizationSearchText(query);
            if (!normalizedQuery) return null;

            return pokemonList.find(pokemon =>
                pokemon.searchText === normalizedQuery ||
                pokemon.id.toString() === normalizedQuery
            ) || null;
        }

        function parseUnifiedSearchState(query) {
            const regularQuery = parseRegularMapQuery(query);
            const identityMatches = getDenIdentityMatches(query);
            if (regularMapQueryIsExplicit(regularQuery) || identityMatches.length > 0) {
                currentFilter = '';
                currentPoolFilter = '';
                currentPoolMatches = [];
                currentRegularFilter = String(query).trim();
                currentRegularDenMatches = regularMapQueryIsExplicit(regularQuery)
                    ? getRegularMapDenMatches(regularQuery)
                    : new Set(identityMatches.map(den => den.physical_id));
                return;
            }

            const parsedPoolQuery = parseOptimizationPoolQuery(query);
            const poolEntries = getOptimizationPoolEntriesForQuery(query);
            const exactPokemon = getExactPokemonSearchMatch(query);
            const hasStructuredPoolQuery = Boolean(
                parsedPoolQuery.version ||
                parsedPoolQuery.beam ||
                parsedPoolQuery.tier ||
                parsedPoolQuery.signature ||
                parsedPoolQuery.poolIds.length > 0
            );
            const usePoolFilter = poolEntries.length > 0 && (hasStructuredPoolQuery || !exactPokemon);

            currentFilter = exactPokemon && !usePoolFilter ? exactPokemon.id.toString() : '';
            currentPoolFilter = usePoolFilter ? String(query).trim() : '';
            currentPoolMatches = usePoolFilter ? poolEntries.map(entry => entry.pool) : [];
            currentRegularFilter = '';
            currentRegularDenMatches = null;
        }

        function setupUnifiedSearch() {
            const searchInput = document.getElementById('pokemonSearch');
            if (!searchInput) return;

            searchInput.addEventListener('input', function() {
                const query = this.value.trim();
                parseUnifiedSearchState(query);
                if (query.length > 0) {
                    showUnifiedSearchResults(query);
                } else {
                    hideDropdown();
                }
                applyFilters();
            });

            searchInput.addEventListener('blur', function() {
                setTimeout(() => hideDropdown(), 150);
            });

            searchInput.addEventListener('focus', function() {
                showUnifiedSearchResults(this.value.trim());
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    clearUnifiedSearch();
                }
            });
        }

        function showUnifiedSearchResults(query) {
            const dropdown = document.getElementById('pokemonDropdown');
            if (!dropdown) return;

            const pokemonMatches = getPokemonSearchMatches(query).slice(0, 30);
            const regularMatches = getRegularMapSearchSuggestions(query);
            const poolMatches = query ? getOptimizationPoolEntriesForQuery(query).slice(0, 30) : [];
            const resultMarkup = [];

            if (pokemonMatches.length > 0) {
                resultMarkup.push('<div class="search-results-heading">Pokémon</div>');
                resultMarkup.push(...pokemonMatches.map(pokemon => `
                    <div class="pokemon-search-item" data-search-type="pokemon" data-pokemon-id="${pokemon.id}">
                        ${escapeHtml(capitalizePokemonName(pokemon.name))} (#${pokemon.id})
                    </div>
                `));
            }

            if (regularMatches.length > 0) {
                resultMarkup.push('<div class="search-results-heading">Dens</div>');
                resultMarkup.push(...regularMatches.map((suggestion, index) => `
                    <div class="pokemon-search-item" data-search-type="regular" data-regular-index="${index}">
                        ${escapeHtml(suggestion.label)}
                    </div>
                `));
            }

            if (poolMatches.length > 0) {
                resultMarkup.push('<div class="search-results-heading">Hunts</div>');
                resultMarkup.push(...poolMatches.map(entry => `
                    <div class="pokemon-search-item" data-search-type="pool" data-pool-key="${escapeHtml(entry.key)}">
                        ${escapeHtml(entry.label)}
                    </div>
                `));
            }

            dropdown.innerHTML = resultMarkup.length > 0
                ? resultMarkup.join('')
                : '<div class="pokemon-search-item">No Pokémon, den, or hunt found</div>';

            dropdown.querySelectorAll('[data-search-type="pokemon"]').forEach(item => {
                item.addEventListener('mousedown', function(event) {
                    event.preventDefault();
                    const pokemon = pokemonList.find(candidate => candidate.id === Number(this.dataset.pokemonId));
                    if (pokemon) selectPokemon(pokemon.id, pokemon.name);
                });
            });
            dropdown.querySelectorAll('[data-search-type="pool"]').forEach(item => {
                item.addEventListener('mousedown', function(event) {
                    event.preventDefault();
                    selectOptimizationPool(this.dataset.poolKey);
                });
            });
            dropdown.querySelectorAll('[data-search-type="regular"]').forEach(item => {
                item.addEventListener('mousedown', function(event) {
                    event.preventDefault();
                    const suggestion = regularMatches[Number(this.dataset.regularIndex)];
                    if (suggestion) selectRegularMapSearch(suggestion);
                });
            });
            dropdown.style.display = 'block';
        }

        function hideOptimizationPoolDropdown() {
            hideDropdown();
        }

        function selectOptimizationPool(poolKey) {
            const searchInput = document.getElementById('pokemonSearch');
            const normalizedKey = String(poolKey).toLowerCase();
            currentFilter = '';
            const selectedEntry = optimizationPoolList.find(entry => entry.key.toLowerCase() === normalizedKey);
            if (searchInput) searchInput.value = selectedEntry ? selectedEntry.label : poolKey;
            currentPoolFilter = selectedEntry ? selectedEntry.label : String(poolKey);
            const selectedPool = selectedEntry ? selectedEntry.pool : optimizationPoolIndex.get(normalizedKey);
            currentPoolMatches = selectedPool ? [selectedPool] : [];
            currentRegularFilter = '';
            currentRegularDenMatches = null;
            hideOptimizationPoolDropdown();
            applyFilters();
        }

        function selectRegularMapSearch(suggestion) {
            const searchInput = document.getElementById('pokemonSearch');
            if (searchInput) searchInput.value = suggestion.label;
            currentFilter = '';
            currentPoolFilter = '';
            currentPoolMatches = [];
            currentRegularFilter = suggestion.label;
            currentRegularDenMatches = suggestion.denMatches;
            hideDropdown();
            applyFilters();
        }

        function clearOptimizationPoolFilter() {
            const searchInput = document.getElementById('pokemonSearch');
            if (searchInput) searchInput.value = '';
            currentFilter = '';
            currentPoolFilter = '';
            currentPoolMatches = [];
            currentRegularFilter = '';
            currentRegularDenMatches = null;
            hideOptimizationPoolDropdown();
            applyFilters();
        }

        function clearUnifiedSearch() {
            clearOptimizationPoolFilter();
        }
        
        function hideDropdown() {
            document.getElementById('pokemonDropdown').style.display = 'none';
        }
        
        function selectPokemon(pokemonId, pokemonName) {
            const searchInput = document.getElementById('pokemonSearch');
            searchInput.value = capitalizePokemonName(pokemonName);
            hideDropdown();
            currentFilter = pokemonId.toString();
            currentPoolFilter = '';
            currentPoolMatches = [];
            applyFilters();
        }
        
        // Star filter functions
        function toggleStarFilter(star) {
            const button = document.querySelector(`[data-star="${star}"]`);
            
            if (selectedStars.has(star)) {
                selectedStars.delete(star);
                button.classList.remove('active');
            } else {
                selectedStars.add(star);
                button.classList.add('active');
            }
            
            applyFilters();
        }
        
        function clearStarFilters() {
            selectedStars.clear();
            document.querySelectorAll('.star-button').forEach(button => {
                button.classList.remove('active');
            });
            applyFilters();
        }
        
        function applyFilters() {
            filterDensByFilters();
            refreshModalIfOpen();
        }
        
        function filterDensByFilters() {
            const pokemonId = currentFilter ? parseInt(currentFilter) : null;
            const hasStarFilter = selectedStars.size > 0;
            const hasPoolFilter = currentPoolFilter.length > 0;
            const hasRegularFilter = currentRegularDenMatches !== null;
            
            if (!pokemonId && !hasStarFilter && !hasPoolFilter && !hasRegularFilter) {
                allMarkers.forEach(marker => {
                    marker.setStyle({
                        fillColor: '#ff0000',
                        color: '#ffffff',
                        opacity: 1,
                        fillOpacity: 0.8,
                        weight: 2
                    });
                });
                updateFilterStatus({total: allMarkers.length}, allMarkers.length);
                return;
            }
            
            let counts = { common: 0, rare: 0, both: 0, total: 0 };
            const pokemonName = pokemonId ? pokemonNames[pokemonId] : null;
            
            allMarkers.forEach(marker => {
                const den = marker.denData;
                const matchingPools = hasPoolFilter
                    ? currentPoolMatches.filter(pool => denMatchesOptimizationPool(den, pool))
                    : [];
                const poolMatches = !hasPoolFilter || matchingPools.length > 0;
                const regularMatches = !hasRegularFilter || currentRegularDenMatches.has(den.physical_id);
                let otherFiltersMatch = false;
                let pokemonResult = null;
                
                if (pokemonId && hasStarFilter) {
                    otherFiltersMatch = denContainsPokemonAtStarRanks(den, pokemonId, selectedStars);
                    if (otherFiltersMatch) {
                        pokemonResult = denContainsPokemon(den, pokemonId);
                    }
                } else if (pokemonId && !hasStarFilter) {
                    pokemonResult = denContainsPokemon(den, pokemonId);
                    otherFiltersMatch = pokemonResult.hasPokemon;
                } else if (!pokemonId && hasStarFilter) {
                    otherFiltersMatch = denContainsStarRanks(den, selectedStars);
                } else if (!pokemonId && !hasStarFilter) {
                    otherFiltersMatch = true;
                }

                const denMatches = regularMatches && poolMatches && otherFiltersMatch;
                
                if (denMatches) {
                    counts.total++;
                    let fillColor, borderColor;
                    
                    if (pokemonResult && pokemonResult.hasPokemon) {
                        switch (pokemonResult.poolType) {
                        case 'common':
                                fillColor = '#ff0000';
                            borderColor = '#cc0000';
                            counts.common++;
                            break;
                        case 'rare':
                                fillColor = '#8b00ff';
                            borderColor = '#6600cc';
                            counts.rare++;
                            break;
                        case 'both':
                                fillColor = '#ff0000';
                                borderColor = '#8b00ff';
                            counts.both++;
                            break;
                        }
                    } else if (matchingPools.length > 0 && matchingPools.every(pool => pool.beam === 'rare')) {
                        fillColor = '#8b00ff';
                        borderColor = '#6600cc';
                    } else {
                        fillColor = '#ff0000';
                        borderColor = '#cc0000';
                    }
                    
                    marker.setStyle({
                        fillColor: fillColor,
                        color: borderColor,
                        opacity: 1,
                        fillOpacity: 0.9,
                        weight: 3
                    });
                } else {
                    marker.setStyle({
                        fillColor: '#cccccc',
                        color: '#999999',
                        opacity: 0.3,
                        fillOpacity: 0.2,
                        weight: 1
                    });
                }
            });
            
            updateFilterStatus(
                counts,
                allMarkers.length,
                pokemonName,
                selectedStars,
                currentPoolFilter,
                currentPoolMatches.length > 0,
                currentPoolMatches.length,
                currentRegularFilter,
                !hasRegularFilter || currentRegularDenMatches.size > 0
            );
        }
        
        function denContainsPokemon(den, pokemonId) {
            const commonPokemon = getPokemonFromBothVersions(den.common_pool, den, 'common');
            const rarePokemon = getPokemonFromBothVersions(den.rare_pool, den, 'rare');
            
            const inCommon = commonPokemon.some(pokemon => pokemon.species === pokemonId);
            const inRare = rarePokemon.some(pokemon => pokemon.species === pokemonId);
            
            return {
                hasPokemon: inCommon || inRare,
                inCommon: inCommon,
                inRare: inRare,
                poolType: inCommon && inRare ? 'both' : (inCommon ? 'common' : (inRare ? 'rare' : 'none'))
            };
        }
        
        function denContainsPokemonAtStarRanks(den, pokemonId, starSet) {
            const commonPokemon = getPokemonFromBothVersions(den.common_pool, den, 'common');
            const rarePokemon = getPokemonFromBothVersions(den.rare_pool, den, 'rare');
            const allPokemon = [...commonPokemon, ...rarePokemon];
            
            const selectedRanks = Array.from(starSet).map(star => star - 1);
            
            const targetPokemon = allPokemon.filter(pokemon => pokemon.species === pokemonId);
            
            if (targetPokemon.length === 0) {
                return false;
            }
            
            for (let pokemon of targetPokemon) {
                let pokemonRanks = [];
                
                if (pokemon.swordRanks && typeof pokemon.swordRanks === 'object') {
                    for (let rank = pokemon.swordRanks.min; rank <= pokemon.swordRanks.max; rank++) {
                        if (!pokemonRanks.includes(rank)) {
                            pokemonRanks.push(rank);
                        }
                    }
                }
                if (pokemon.shieldRanks && typeof pokemon.shieldRanks === 'object') {
                    for (let rank = pokemon.shieldRanks.min; rank <= pokemon.shieldRanks.max; rank++) {
                        if (!pokemonRanks.includes(rank)) {
                            pokemonRanks.push(rank);
                        }
                    }
                }
                
                if (pokemon.minRank !== undefined && pokemon.maxRank !== undefined) {
                    for (let rank = pokemon.minRank; rank <= pokemon.maxRank; rank++) {
                        if (!pokemonRanks.includes(rank)) {
                            pokemonRanks.push(rank);
                        }
                    }
                }
                
                const hasMatch = selectedRanks.some(selectedRank => pokemonRanks.includes(selectedRank));
                
                if (hasMatch) {
                    return true;
                }
            }
            
            return false;
        }
        
        function denContainsStarRanks(den, starSet) {
            const commonPokemon = getPokemonFromBothVersions(den.common_pool, den, 'common');
            const rarePokemon = getPokemonFromBothVersions(den.rare_pool, den, 'rare');
            const allPokemon = [...commonPokemon, ...rarePokemon];
            
            const selectedRanks = Array.from(starSet).map(star => star - 1);
            
            for (let pokemon of allPokemon) {
                let pokemonRanks = [];
                
                if (pokemon.swordRanks && typeof pokemon.swordRanks === 'object') {
                    for (let rank = pokemon.swordRanks.min; rank <= pokemon.swordRanks.max; rank++) {
                        if (!pokemonRanks.includes(rank)) {
                            pokemonRanks.push(rank);
                        }
                    }
                }
                if (pokemon.shieldRanks && typeof pokemon.shieldRanks === 'object') {
                    for (let rank = pokemon.shieldRanks.min; rank <= pokemon.shieldRanks.max; rank++) {
                        if (!pokemonRanks.includes(rank)) {
                            pokemonRanks.push(rank);
                        }
                    }
                }
                
                if (pokemon.minRank !== undefined && pokemon.maxRank !== undefined) {
                    for (let rank = pokemon.minRank; rank <= pokemon.maxRank; rank++) {
                        if (!pokemonRanks.includes(rank)) {
                            pokemonRanks.push(rank);
                        }
                    }
                }
                
                const hasMatch = selectedRanks.some(selectedRank => pokemonRanks.includes(selectedRank));
                if (hasMatch) {
                    return true;
                }
            }
            
            return false;
        }
        
        function updateFilterStatus(counts, total, pokemonName = null, starSet = null, poolKey = null, poolFound = true, poolMatchCount = 0, regularFilter = null, regularFound = true) {
            const statusElement = document.getElementById('filterStatus');
            const poolFilterIsValid = !poolKey || poolFound;
            const regularFilterIsValid = !regularFilter || regularFound;
            
            if (pokemonName || (starSet && starSet.size > 0) || poolKey || regularFilter) {
                const totalCount = (typeof counts === 'object' && counts.total !== undefined) ? counts.total : counts;
                let statusText = regularFilter && !regularFound
                    ? `No den found for <strong>${escapeHtml(regularFilter)}</strong>`
                    : poolKey && !poolFound
                    ? `No hunt found for <strong>${escapeHtml(poolKey)}</strong>`
                    : `Showing ${totalCount} of ${total} dens`;
                
                const filters = [];
                if (pokemonName) {
                    filters.push(`<strong>${escapeHtml(pokemonName)}</strong>`);
                }
                if (starSet && starSet.size > 0) {
                    const starText = Array.from(starSet).sort((a, b) => a - b).map(s => `${s}☆`).join(', ');
                    filters.push(`<strong>${starText}</strong>`);
                }
                if (poolKey && poolFound) {
                    const poolLabel = poolMatchCount > 1
                        ? `${poolMatchCount} hunts matching "${escapeHtml(poolKey)}"`
                        : escapeHtml(poolKey);
                    filters.push(`<strong>${poolLabel}</strong>`);
                }
                if (regularFilter && regularFound) {
                    filters.push(`<strong>${escapeHtml(regularFilter)}</strong>`);
                }
                
                if (filters.length > 0 && poolFilterIsValid && regularFilterIsValid) {
                    statusText += ` with ${filters.join(' and ')}`;
                }
                
                statusElement.innerHTML = statusText;
                statusElement.style.display = 'block';
            } else {
                statusElement.style.display = 'none';
            }
        }
        
        function refreshModalIfOpen() {
            if (currentModalDen && currentModalIndex !== null && 
                document.getElementById('denModal').style.display === 'flex') {
                const content = createDenPopup(currentModalDen, currentModalIndex);
                const locationLabel = currentModalDen.display_name || getAreaName(currentModalDen.location);
                const programLabel = currentModalDen.physical_id
                    ? currentModalDen.physical_id.toUpperCase()
                    : 'Raid Den';
                const title = `${locationLabel} (${programLabel})`;
                
                document.getElementById('modalContent').innerHTML = `
                    <div class="modal-header">
                        <h3 class="modal-title">${title}</h3>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-scroll-container">
                        ${content}
                    </div>
                `;
            }
        }
        
        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Hide editing UI unless debug param present
            const editingSection = document.getElementById('editingSection');
            if (editingSection && !isDebug) {
                editingSection.style.display = 'none';
            }
            document.getElementById('denModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
            
            document.getElementById('pokemonDetailModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closePokemonDetailModal();
                }
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeImageModal();
                    closeModal();
                    closePokemonDetailModal();
                }
            });
            
            document.addEventListener('click', function(e) {
                const modalContent = e.target.closest('.modal-content');
                const pokemonContent = e.target.closest('.pokemon-detail-content');
                if (modalContent || pokemonContent) {
                    e.stopPropagation();
                }
            });
            // End pin drag if mouse released outside map
            if (isDebug) {
                document.addEventListener('mouseup', function() {
                    if (editMode) {
                        endPinDrag();
                    }
                });
            }
        });
        
        // Window resize handler
        window.addEventListener('resize', function() {
            if (compositeMap) {
                                    setTimeout(() => {
                    compositeMap.invalidateSize();
                                    }, 100);
            }
        });
    </script>
